    <style>
         body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
     }

    header > section{
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid lightgrey;
    }

     nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 50px;
        border-bottom: 1px solid lightgray;
        padding: 20px;
     }

     nav > a{
        text-decoration: none;
        color: black;
     }

     .search-bar{
        padding: 5px 10px;
        border: 1px solid gray;
        border-radius: 20px;
        outline: none;
        position: absolute;
        left: 20px;        
     }

     .header{
        height: 120dvh;
        width: 100dvw;
        flex-direction: column;
     }
     
     main {
        flex: 1;

body{
  background: #f5f5f5;
}

.menu{
  display: flex;
  gap: 30px;
  list-style: none;
  color: #555;
  font-size: 14px;
  font-weight: bold;
}

.container{
  width: 90%;
  margin: 40px auto;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}


.card{
  background: white;
  border-radius: 12px;
  padding: 20px;

  display: flex;
  align-items: center;
  gap: 15px;

  transition: 0.3s;
  cursor: pointer;

  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card:hover{
  transform: translateY(-5px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.card img{
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
}

.card h3{
  font-size: 18px;
  color: #333;
}


@media(max-width: 900px){
  .container{
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 600px){
  .container{
    grid-template-columns: 1fr;
  }

  .menu{
    flex-wrap: wrap;
    gap: 10px;
  }
}

    </style>
